<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Factura ' + ${pedido.numeroFactura}">Factura EcoAssets</title>
</head>
<body style="margin:0;padding:24px 12px;background:#ebebeb;">
    <p style="max-width:640px;margin:0 auto 16px auto;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#333333;line-height:1.5;">
        Hola <strong th:text="${pedido.comprador?.nombre}">cliente</strong>, gracias por tu compra en EcoAssets.
        Aquí tienes el detalle:
    </p>
    <div th:replace="~{factura/_cuerpo :: cuerpo(${pedido}, ${urlFactura})}"></div>
</body>
</html>
