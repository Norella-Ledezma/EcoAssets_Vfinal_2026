<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Editar Producto')}"></head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
 
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square"></i> Editar producto
                        </h4>
                    </div>
                    <div class="card-body p-4">
 
                        <!-- Formulario de edición -->
                        
                        <form th:action="@{/dispositivos/editar/{id}(id=${dispositivo.id})}"
                              th:object="${dispositivo}" method="post" enctype="multipart/form-data">
 
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre del producto *</label>
                                <input type="text" class="form-control" th:field="*{nombre}"
                                       placeholder="Ej: iPhone 15 Pro Max" required>
                            </div>
 
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Marca *</label>
                                    <input type="text" class="form-control" th:field="*{marca}"
                                           placeholder="Ej: Apple" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Modelo *</label>
                                    <input type="text" class="form-control" th:field="*{modelo}"
                                           placeholder="Ej: A2849" required>
                                </div>
                            </div>
 
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Categoría *</label>
                                    <select class="form-select" th:field="*{categoria}" required>
                                        <option value="">Selecciona...</option>
                                        <option value="Smartphones">Smartphones</option>
                                        <option value="Laptops">Laptops</option>
                                        <option value="Tablets">Tablets</option>
                                        <option value="Consolas">Consolas</option>
                                        <option value="Audio">Audio</option>
                                        <option value="Televisores">Televisores</option>
                                        <option value="Accesorios">Accesorios</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Estado *</label>
                                    <select class="form-select" th:field="*{estado}" required>
                                        <option value="Usado">Usado</option>
                                        <option value="Reacondicionado">Reacondicionado</option>
                                    </select>
                                </div>
                            </div>
 
                            <div class="mb-3">
                                <label class="form-label fw-bold">Precio (COP) *</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" th:field="*{precio}"
                                           step="0.01" min="0" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Cantidad disponible: *</label>
                                <input type="number" class="form-control" name="stock"
                                       th:value="${dispositivo.stock}" min="1" max="999" step="1" required>
                                <div class="form-text">¿Cuántas unidades tienes para vender?</div>
                            </div>

                            <div class="mb-3">
                                <label for="departamento" class="form-label">Departamento</label>
                                <select class="form-select" id="departamento" th:field="*{departamento}" required>
                                    <option value="" selected>Selecciona un departamento...</option>
                                    <option value="Antioquia">Antioquia</option>
                                    <option value="Atlántico">Atlántico</option>
                                    <option value="Bogotá D.C.">Bogotá D.C.</option>
                                    <option value="Bolívar">Bolívar</option>
                                    <option value="Valle del Cauca">Valle del Cauca</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="municipio" class="form-label">Municipio/Ciudad</label>
                                <input type="text" class="form-control" id="municipio" th:field="*{municipio}" placeholder="Ej: Cartagena" required>
                            </div>
 
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control" th:field="*{descripcion}"
                                          rows="3" placeholder="Describe el estado y características del producto"></textarea>
                            </div>
 
                           <div class="mb-4">
                                <label class="form-label fw-bold">Foto del producto</label>

                                <!-- foto actual del producto -->
                                <div class="mb-2" th:if="${dispositivo.imagenUrl != null and !#strings.isEmpty(dispositivo.imagenUrl)}">
                                    <div class="form-text mb-1">Foto actual:</div>
                                    <img th:src="${dispositivo.imagenUrl}" class="img-thumbnail" style="max-height:150px;" alt="Foto actual">
                                </div>

                                <input type="file" class="form-control" name="foto"
                                       accept="image/jpeg,image/png,image/webp" id="inputFoto">
                                <div class="form-text">esto es opcional si no quieres cambiar la foto.</div>

                                <!-- vista previa de la nueva foto cambiada-->
                                <img id="preview" class="img-thumbnail mt-2 d-none" style="max-height:150px;" alt="Vista previa">
                            </div>
                            <script>
                                document.getElementById('inputFoto').addEventListener('change', e => {
                                    const f = e.target.files[0];
                                    const img = document.getElementById('preview');
                                    if (f) {
                                        img.src = URL.createObjectURL(f);
                                        img.classList.remove('d-none');
                                    } else {
                                        img.classList.add('d-none');
                                    }
                                });
                            </script>
 
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-warning flex-grow-1">
                                    <i class="bi bi-check-lg"></i> Guardar cambios
                                </button>
                                <a href="/dispositivos" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-lg"></i> Cancelar
                                </a>
                            </div>
 
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
 
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
