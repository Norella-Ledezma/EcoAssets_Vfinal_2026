#--mongo atlas

spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.database=${MONGODB_DATABASE}

spring.data.mongodb.uri=${MONGODB_URI}

#--fotos cloudinary---
cloudinary.url=cloudinary://135142279481949:bZK19BCY3dnr91_VGH3lqo5C-9s@btrjvaan
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML


# Encoding
spring.thymeleaf.encoding=UTF-8

# Static resources
spring.web.resources.static-locations=classpath:/static/

# Clave secreta
app.jwt.secret=${JWT_SECRET}
# Tiempo de expiración en milisegundos para 48 horas
app.jwt.expiration=172800000

# GOOGLE OAUTH2 CONFIGURATION
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

spring.jmx.enabled=false



# ===============================
# CORREO (facturas) - SMTP
# Los valores reales NO van aqui: se ponen en EcoAssets/config/application.properties
# (archivo local, ignorado por git) o como variables de entorno MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASS.
# Si MAIL_HOST esta vacio, el correo no se envia y la app funciona igual.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL}
app.base-url=http://localhost:8082
